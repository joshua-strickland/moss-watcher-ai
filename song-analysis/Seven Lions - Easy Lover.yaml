arrangement:
  - section_name: Pre Intro swell FX
    duration_bars: 1
    elements:
      - category: Synth - Swell
        label: tonal reverse granular swell
        tonality: some sort of piano / tonal like sound repeated every beat or so
        pattern: one swell
        timing: 1.1.1
        automation: Swell rises in volume over the bar serving to quickly raise energy right from the start

  - section_name: Intro
