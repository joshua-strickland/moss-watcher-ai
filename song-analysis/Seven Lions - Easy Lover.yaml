 # yaml-language-server: $schema=./song-schema.json

track_metadata:
  artist: Seven Lions
  title: Easy Lover
  key_signature: Bb major
  bpm: 137
  time_signature: 4/4
  genre: Future Bass / House / Melodic House Future Bass hybrid

sounds:
  granular_swell:
    category: Synth - Swell
    label: tonal reverse granular swell
    tonality: some sort of piano / tonal like sound repeated every beat or so

  vocal_synth_swell:
    category: Synth - Swell
    label: vocal / synth swell

  chord_pluck:
    category: Synth - Pluck
    label: lead chord pluck
    tonality: triangle sounding chord pluck

  rapid_pluck:
    category: Synth - Pluck
    label: lead rapid pluck
    tonality: saw pluck of some sort. distorted a bit

  slow_attack_accents:
    category: Synth - Pluck
    label: background slow attack synth accents
    tonality: slow attack high frequency synth, think a fairly basic saw sound

  string_pad:
    category: Synth - Pad
    tonality: string like sounding synth pad. not a ton of reverb, but lots of sustain

  phone_arp:
    category: FX - Synth
    tonality: phone call like sounding rapid arp sine synth. long reverb tail

  laser_fx:
    category: FX - Synth
    label: electric rapid lasser / noise sounding FX

  bass_house_hats:
    category: Drums - Hats
    tonality: snappy, loud, high treble content kind of bass house sounding hat

  standard_hats:
    category: Drums - Hats
    tonality: standard hats

  kick:
    category: Drums - Kick
    tonality: full kick

  reverse_kick:
    category: Drums - Kick
    label: Reverse kick drum
    tonality: full kick reversed

  plastic_snare:
    category: Drums - Snare
    tonality: very electronic "plastic" sounding snare

  soft_snare:
    category: Drums - Snare
    label: transitionary snare hits
    tonality: more typical sounding snare, soft hit

  clap:
    category: Drums - Clap
    tonality: basic clap

  triangle_hit:
    category: Drums - Other Percussive
    label: triangle hit
    tonality: like the hanging triangle thing that drummers hit

  reverse_ride:
    category: Drums - Rides
    label: reverse ride / cymbal
    tonality: this is either a very quick noise sweep or a cymbal / ride / open hat reversed

  crash_ride:
    category: Drums - Rides
    label: crash / ride cymbal

  sidechained_bass:
    category: Bass
    tonality: sub & mid range bass, not overly aggressive but some distortion, not particularly prominent
      sidechained to kick

  unsidechained_bass:
    category: Bass
    tonality: Sub & mid bass content, mid bass sounds distorted a bit
      Not side chained.
      Does have a bit of a louder transient on every quarter note
      Sustained sound is a bit quieter

  lead_vocals:
    category: Vocals - Lead
    tonality: Very soft female vocals
      fair amount of  reverb
      sounds like its slightly autotuned or put through a vocoder

  background_vocals:
    category: Vocals - Background
    tonality: Very soft female vocals
      fair amount of  reverb
      sounds like its slightly autotuned or put through a vocoder
      very cut off

  vocal_chop:
    category: Vocals - Chop

  white_noise_sweep:
    category: Transition - Sweep
    label: white noise sweep

  gentle_sweep:
    category: Transition - Sweep
    label: long gentle sweep
    tonality: longer gentler ascending white noise sweep, little low end content

  rapid_sweep:
    category: Transition - Sweep
    label: rapid high energy sweep
    tonality: quick louder maybe slightly saturated descending white noise sweep
      maybe reverse snare?

  lingering_sweep:
    category: Transition - Sweep
    label: lingering descending noise sweep
    tonality: longer gentler descending white noise sweep

  mid_noise_sweep:
    category: Transition - Sweep
    tonality: mid range sounding ascending white noise sweep

  pre_transition_impact:
    category: FX - Impact
    label: pre transition impact

  big_kick_impact:
    category: FX - Impact
    label: big kick impact

arrangement:
  - section_name: Pre Intro swell FX
    duration_bars: 1
    elements:
      - sound: granular_swell
        pattern: one swell
        automation: Swell rises in volume over the bar serving to quickly raise energy right from the start
        timing:
          active: ["1.1.1 - end"]

  - section_name: Intro
    duration_bars: 8
    global_transitions: At 8.1.1, instruments and vocals cut out, swells begin
      At 8.4.1, everything cuts out, snare hits, building tension into verse a
    elements:
      - sound: chord_pluck
        pattern: The pluck utilizes a mix of dotted eighth and eighth notes in the following sequence repeating per bar x.1.1, x.1.4, x.2.3, x.3.1, x.3.4, x.4.3.
        timing:
          active: ["1.1.1 - 8.1.1"]

      - sound: bass_house_hats
        pattern: 2 or 3 rapid 16th note sequences, where the loudest hat always lands on the up beat or And.
          resulting in a quiet-LOUD-quiet or LOUD-quiet pattern. This gives it a 4 on the floor feel, with a bit
          more energy
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        timing:
          hits: ["1.1.1", "5.1.1"]

      - sound: lead_vocals
        pattern: The vocal follows a similar pattern as the lead chord pluck
          utilizes a mix of dotted eighth and eighth notes in the following sequence repeating per bar x.1.1, x.1.4, x.2.3, x.3.1, x.3.4, x.4.3.
          it does alternate to eighth notes near the end of bars however.
        timing:
          active: ["1.1.1 - end"]

      - sound: granular_swell
        pattern: one swell
        automation: Swell rises in volume over the bar serving to quickly raise energy right from the start
        timing:
          active: ["8.1.1 - 8.4.1"]

      - sound: white_noise_sweep
        pattern: once
        automation: hi cut filter expands upward quickly over one beat
        timing:
          active: ["8.3.1 - 8.4.1"]

      - sound: plastic_snare
        timing:
          description: once, at 8.4.1, transitory element leading into verse a
          hits: ["8.4.1"]

      - sound: reverse_kick
        timing:
          description: transitory element leading into verse a
          active: ["8.4.3 - end"]

  - section_name: verse a
    duration_bars: 16
    elements:
      - sound: sidechained_bass
        timing:
          active: ["1.1.1 - 16.3.1"]

      - sound: bass_house_hats
        pattern: 2 or 3 rapid 16th note sequences, where the loudest hat always lands on the up beat or And.
          resulting in a quiet-LOUD-quiet or LOUD-quiet pattern. This gives it a 4 on the floor feel, with a bit
          more energy
        automation: at 16.1.1, volume increase
        timing:
          active: ["1.1.1 - 16.3.1"]

      - sound: kick
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]

      - sound: soft_snare
        pattern: 2 quick 16th note hits
        timing:
          hits: ["4.4.3", "4.4.4", "12.4.3", "12.4.4"]

      - sound: rapid_pluck
        pattern: high energy 16th notes
        automation: starts fairly cut off.  high cut filter expands around 5.1.1, and then gradually expands until end of section.
        timing:
          active: ["1.1.1 - end"]

      - sound: slow_attack_accents
        pattern: 2 quick 16th notes
        timing:
          active: ["11.1.1 - 13.1.1", "15.1.1 - 17.1.1"]

      - sound: gentle_sweep
        timing:
          active: ["7.1.1 - 8.4.1"]

      - sound: rapid_sweep
        timing:
          active: ["8.4.1 - 8.4.4"]

      - sound: lingering_sweep
        timing:
          active: ["9.1.1 - 11.1.1"]

      - sound: pre_transition_impact
        timing:
          hits: ["16.4.1"]

      - sound: reverse_ride
        timing:
          active: ["16.3.3 - 16.4.1"]

      - sound: lead_vocals
        pattern: longer held notes than in intro
        timing:
          active: ["1.1.1 - end"]

      - sound: background_vocals
        pattern: longer held notes than in intro. same pattern and notes as background slow attack synth accents
        timing:
          active: ["11.1.1 - 13.1.1", "15.1.1 - 17.1.1"]

  - section_name: break
    duration_bars: 8
    global_transitions: at 8.4.1 everything but vocal cuts
    elements:
      - sound: big_kick_impact
        timing:
          hits: ["1.1.1"]

      - sound: rapid_pluck
        pattern: high energy 16th notes
        automation: hi cut filter is almost fully expanded here, dramatically changing the tone. sounds electric
          I suspect a bandpass filter may be adjusting cut off up and down slightly throughout section
        timing:
          active: ["1.1.1 - 7.1.1"]

      - sound: standard_hats
        pattern: swung 16th notes
        automation: hi cut filter gradually ascends throughout section
        timing:
          active: ["1.1.1 - 8.1.1"]

      - sound: soft_snare
        pattern: swung 16th notes
        automation: hi cut filter gradually ascends throughout section
        timing:
          active: ["1.1.1 - 8.1.1"]

      - sound: triangle_hit
        pattern: every bar
        timing:
          active: ["1.1.1 - end"]

      - sound: plastic_snare
        timing:
          description: once, at 8.4.1, transitory element leading into verse a
          hits: ["8.4.1"]

      - sound: unsidechained_bass
        timing:
          active: ["1.1.1 - 7.1.1"]

      - sound: string_pad
        pattern: A chord that shifts about every bar
        automation: hi pass filter descends gradually around 6.1.1 until end of section
        timing:
          active: ["1.1.1 - 8.4.1"]

      - sound: gentle_sweep
        timing:
          active: ["7.1.1 - 8.4.1"]

      - sound: lead_vocals
        pattern: longer held notes than in intro
        timing:
          active: ["1.1.1 - end"]

      - sound: background_vocals
        pattern: longer held notes than in intro. same pattern and notes as background slow attack synth accents
        timing:
          active: ["5.1.1 - 7.1.1"]

  - section_name: break 2
    duration_bars: 8
    elements:
      - sound: kick
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]

      - sound: bass_house_hats
        pattern: 2 or 3 rapid 16th note sequences, where the loudest hat always lands on the up beat or And.
          resulting in a quiet-LOUD-quiet or LOUD-quiet pattern. This gives it a 4 on the floor feel, with a bit
          more energy
        automation: As section begins, these are very very loud, very much like bass house hats.
        timing:
          active: ["1.1.1 - end"]

      - sound: unsidechained_bass
        timing:
          active: ["1.1.1 - end"]

      - sound: vocal_chop
        timing:
          active: ["1.1.1 - end"]

      - sound: rapid_pluck
        pattern: quick 2 note 16th note fill
        automation: hi cut filter is almost fully expanded here, dramatically changing the tone. sounds electric
          I suspect a bandpass filter may be adjusting cut off up and down slightly throughout section
        timing:
          hits: ["4.4.1", "4.4.3"]

      - sound: gentle_sweep
        notes: descending this time
        timing:
          active: ["1.1.1 - 4.1.1"]

      - sound: gentle_sweep
        timing:
          active: ["7.1.1 - end"]

      - sound: vocal_synth_swell
        timing:
          active: ["8.1.1 - end"]

      - sound: laser_fx
