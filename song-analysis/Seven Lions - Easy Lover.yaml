    global_transitions: At 8.1.1, instruments and vocals cut out, swells begin
      At 8.4.1, everything cuts out, snare hits, building tension into verse a
    elements:
      - category: Synth - Pluck
        label: lead chord pluck
        tonality: triangle sounding chord pluck
        pattern: The pluck utilizes a mix of dotted eighth and eighth notes in the following sequence repeating per bar x.1.1, x.1.4, x.2.3, x.3.1, x.3.4, x.4.3.
        timing: 1.1.1 - 8.1.1

      - category: Drums - Hats
        tonality: snappy, loud, high treble content kind of bass house sounding hat
        pattern: 2 or 3 rapid 16th note sequences, where the loudest hat always lands on the up beat or And.
          resulting in a quiet-LOUD-quiet or LOUD-quiet pattern. This gives it a 4 on the floor feel, with a bit
          more energy
        timing: constant

      - category: Drums - Kick
        tonality: full kick
        timing: once, at 1.1.1, and once again at 5.1.1

      - category: Vocals - Lead
        tonality: Very soft female vocals
          fair amount of  reverb
          sounds like its slightly autotuned or put through a vocoder
        pattern: The vocal follows a similar pattern as the lead chord pluck
          utilizes a mix of dotted eighth and eighth notes in the following sequence repeating per bar x.1.1, x.1.4, x.2.3, x.3.1, x.3.4, x.4.3.
          it does alternate to eighth notes near the end of bars however.
        timing: constant

      - category: Synth - Swell
        label: tonal reverse granular swell
        tonality: some sort of piano / tonal like sound repeated every beat or so
