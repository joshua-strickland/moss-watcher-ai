        automation: As section begins, these are very very loud, very much like bass house hats.
        timing:
          active: ["1.1.1 - 8.4.4"]

      - sound: chord_pluck
        pattern: The pluck utilizes a mix of dotted eighth and eighth notes in the following sequence repeating per bar x.1.1, x.1.4, x.2.3, x.3.1, x.3.4, x.4.3.
        timing:
