          active: ["8.3.1 - 8.4.4"]

      - sound: sidechained_bass
        timing:
          active: ["1.1.1 - 8.4.1"]

      - sound: reverse_kick
        timing:
          description: transitory element leading into verse b
          active: ["8.4.3 - end"]

