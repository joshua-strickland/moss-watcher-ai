# yaml-language-server: $schema=./track_schema.json

track_metadata:
  artist: Ocula
  title: High Tides
  key_signature: D# Major
  bpm: 121
  time_signature: 4/4
  genre: Melodic House

arrangement:
  - section_name: Intro
    duration_bars: 16
    chord_progression: "I - III - IV - V - VI - III - IV"
    elements:
