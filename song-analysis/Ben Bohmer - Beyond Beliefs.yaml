# yaml-language-server: $schema=/song-schema.json

track_metadata:
  artist: Ben Bohmer
  title: Beyond Beliefs
  key_signature: D# Major
  bpm: 124
  time_signature: 4/4
  genre: Melodic House

arrangement:
  - section_name: intro
    duration_bars: 8
    elements:
      - category: Drums - Hats
        tonality: white noise like sounding hats
        pattern: 16th notes
        timing: constant

      - category: Synth - Arp
        tonality: warm saw synth arp
        timing: constant
        pattern: 16th & 8th notes intermixed pattern

      - category: Drums - Other Percussive
        tonality: click, almost clip like kick, only treble content
        timing: constant
        pattern: Every 3rd beat

      - category: Synth - Pluck
        label: prime synth pluck
        tonality: lower note range pluck, 
          has that sort of rapid gated sound on lower notes 
          from the wave form being slow enough to hear the 
          peak of the saw slamming on waveform reset
          fair amount of reverb and delay
          the notes play a short melody which then waits a several bars before coming in again,
          in other words there is a lot of space between when these come in.
          The reverb and delay ring out for a bar or two. 
          This makes the pluck sound fairly massive
        timing: 7.4.3
        pattern: shifts between 8th & quarter notes

  - section_name: verse a
    duration_bars: 48
    elements:
      - category: Drums - Hats
        label: soft hat noise layer 1
        tonality: white noise like sounding hats
        pattern: 16th notes
        timing: constant

      - category: Drums - Shakers
        label: soft shaker
        tonality: This is sort of like the christmas shaker sound in sleigh bells
        pattern: 16th notes
        timing: constant

      - category: Drums - Other Percussive
        label: metallic hit
        tonality: Sort of cowbell like sounding metallic hit, 
          but with much less resonance.
          There is a 16th note delay of some sort
        pattern: x.1.3 and x.3.3, repeating every bar
        timing: constant

      - category: Drums - Kick
        tonality: full sounding kick, mild click, 
          short duration - roughly slightly longer than a single 16th note
        pattern: 4 on the floor
        pattern_variation: cuts out 16.4.1
        timing: constant

      - category: Synth - Arp
        tonality: warm saw synth arp
        timing: constant
        pattern: 16th & 8th notes intermixed pattern

      - category: Bass
        tonality: sub, ducks with kick, duck continues even if kick is absent
          pointing to the usage of a periodic duck through something like
          shaperbox
        timing: constant

      - category: Synth - Pluck
        label: prime synth pluck
        tonality: lower note range pluck,
          has that sort of rapid gated sound on lower notes
          from the wave form being slow enough to hear the
          peak of the saw slamming on waveform reset
          fair amount of reverb and delay
          the notes play a short melody which then waits about 3-4 bars before coming in again,
          in other words there is a lot of space between when these come in.
          The reverb and delay ring  out for a bar or two.
          This makes the pluck sound fairly massive.
          sometimes the pluck is given more or less reverb to accentuate certain
          notes
        timing: 7.4.3
        pattern: shifts between 8th & quarter notes

      - category: Synth - Swell
        label: heavenly swell
        pattern: comes once in after the prime synth pluck cuts out primarily
          about once every 4 bars
        tonality: has that washed multi tonal verbed out sound.
          very ambient & lush soundscape, "heavenly".
          reverb tail lasts approx two bars
          The sound changes notes pitch every time it comes in
        timing: swells in just before bar 12 at first, the reoccurs every 3-4 bars

      - category: Synth - Swell
        label:  rapid reverse synth swell
        pattern: comes once in after the prime synth pluck cuts out primarily
          about once every 4 bars, very frequently along with the heavenly swell
        tonality: sounds like a rapid delay on top of a slow attack saw
          fair amount of reverb applies, fades out over a bar or two
        timing: swells in just before bar 12 at first, the reoccurs every 3-4 bars

      - category: FX - Synth
        label: vowel like transitory synth sound
        pattern: once, 3 descending notes
        tonality: Weird muffled vowel like synth sound
        timing: just prior to bar 17

      - category: Drums - Hats
        label: sharp hi hat layer 3
        tonality: actual hats, another layer on top of original hats
        pattern: 8th notes on up beat
        timing: 17.1.1 and on

      - category: Drums - Snare
        label: snare brush
        tonality: sounds like a snare brush
        pattern: x.1.3, x.3.1, x.4.1, x.4.3
        timing: 17.1.1 and on



