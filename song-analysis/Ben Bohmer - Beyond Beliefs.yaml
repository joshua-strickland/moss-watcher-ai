# yaml-language-server: $schema=/song-schema.json

track_metadata:
  artist: Ben Bohmer
  title: Beyond Beliefs
  key_signature: D# Major
  bpm: 124
  time_signature: 4/4
  genre: Melodic House

sounds:
  shaker_noise_hats:
    category: Drums - Hats
    label: layered hat, white noise & soft shaker
    tonality: Layered percussion combining a real hi-hat, a white-noise-like hat layer,
      and a soft shaker sound all hitting together.
      The shaker component has a Christmas sleigh-bell character;
      at times there is a ringing tonality where extra high-frequency content rings out,
      while other hits have a relatively short release / duration.

  sharp_hats:
    category: Drums - Hats
    label: sharp hi hat layer 3
    tonality: actual hats, another layer on top of original hats

  treble_click:
    category: Drums - Other Percussive
    tonality: click, almost clip like kick, only treble content

  kick:
    category: Drums - Kick
    tonality: full sounding kick, mild click,
      short duration - roughly slightly longer than a single 16th note
    frequencies:
      fundamental_hz: 51

  metallic_hit:
    category: Drums - Other Percussive
    label: metallic hit
    tonality: Sort of cowbell like sounding metallic hit,
      but with much less resonance.
      There is a 16th note delay of some sort

  snare_brush:
    category: Drums - Snare
    label: snare brush
    tonality: sounds like a snare brush

  bass:
    category: Bass
    tonality:  ducks with kick, duck continues even if kick is absent
      pointing to the usage of a periodic duck through something like
      shaperbox. Sounds a bit like a cello actually, has that sort of
      vibration as if a large string bring driven by a bow, perhaps layered
    frequencies:
      fundamental_range_hz: [38, 52]
      span_hz: [20, 700]

  warm_arp:
    category: Synth - Arp
    tonality: warm saw synth arp.
      Is cut off at high-mid range and the hats really 
      fill in the extra space beyond that.
      I think there is another layer that adds a minor 2 hits
      at a lower note range. like a low pitched "sonar" hit.
      Very brief and not incredibly perceptible but definitely present
    frequencies:
      span_hz: [100, 1700]

  prime_pluck:
    category: Synth - Pluck
    label: prime synth pluck
    tonality: lower note range pluck,
      has that sort of rapid gated sound on lower notes
      from the wave form being slow enough to hear the
      peak of the saw slamming on waveform reset
      fair amount of reverb and delay.
      The reverb and delay ring out for a bar or two.
      This makes the pluck sound fairly massive
      sometimes the pluck is given more or less reverb to accentuate certain
      notes
    frequencies:
      fundamental_range_hz: [124,180]
      span_hz: [124, 5000]

  heavenly_swell:
    category: Synth - Swell
    label: heavenly swell
    tonality: has that washed multi tonal verbed out sound.
      very ambient & lush soundscape, "heavenly".
      reverb tail lasts approx two bars
      The sound changes notes pitch every time it comes in

  reverse_swell:
    category: Synth - Swell
    label: rapid reverse synth swell
    tonality: sounds like a rapid delay on top of a slow attack saw
      fair amount of reverb applies, fades out over a bar or two

arrangement:
  - section_name: intro
    duration_bars: 8
    elements:
      - sound: shaker_noise_hats
        pattern: 16th notes
        timing:
          active: [ "1.1.1 - end" ]

      - sound: warm_arp
        pattern: 16th & 8th notes intermixed pattern
        timing:
          active: [ "1.1.1 - end" ]

      - sound: treble_click
        pattern: Every 3rd beat
        timing:
          active: [ "1.1.1 - end" ]

      - sound: prime_pluck
        pattern: shifts between 8th & quarter notes.
          the notes play a short melody which then waits several bars before coming in again,
          in other words there is a lot of space between when these come in
        timing:
          hits: [ "7.4.3" ]

  - section_name: verse a
    duration_bars: 48
    elements:
      - sound: shaker_noise_hats
        pattern: 16th notes
        timing:
          active: [ "1.1.1 - end" ]

      - sound: metallic_hit
        pattern: x.1.3 and x.3.3, repeating every bar
        timing:
          active: [ "1.1.1 - end" ]

      - sound: kick
        pattern: 4 on the floor but with an extra kick on x.3.3.
          The extra kick is not quite as loud or full in terms
          of frequency range. It also seems to be a slightly higher pitch
        timing:
          active: [ "1.1.1 - end" ]
          mutes:
            - "16.4.1"
            - "48.1.1 - end"


      - sound: warm_arp
        pattern: 16th & 8th notes intermixed pattern
        timing:
          active: [ "1.1.1 - end" ]

      - sound: bass
        timing:
          active: [ "1.1.1 - end" ]

      - sound: prime_pluck
        pattern: shifts between 8th & quarter notes.
          the notes play a short melody which then waits about 3-4 bars before coming in again
        timing:
          repeat:
            - start: "1.1.1"
              every_bars: 4
              length_bars: 1

      - sound: heavenly_swell
        pattern: comes in once after the prime synth pluck cuts out
        timing:
          description: swells in just before bar 13 at first, then reoccurs every 3-4 bars
          repeat:
            - start: "12.4.1"
              every_bars: 4
              length_bars: 2

      - sound: reverse_swell
        pattern: comes in once after the prime synth pluck cuts out,
          very frequently along with the heavenly swell
        timing:
          description: swells in just before bar 13 at first, then reoccurs every 3-4 bars
          repeat:
            - start: "12.4.1"
              every_bars: 4
              length_bars: 2

      - category: FX - Synth
        label: vowel like transitory synth sound
        pattern: once, 3 descending notes
        tonality: Weird muffled vowel like synth sound
        timing:
          description: just prior to bar 17
          hits: [ "16.4.1" ]

      - sound: sharp_hats
        pattern: 8th notes on up beat
        timing:
          active: [ "17.1.1 - end" ]

      - sound: snare_brush
        pattern: x.1.3, x.3.1, x.4.1, x.4.3
        notes: On bar 32 the hit gets louder
        timing:
          active: [ "17.1.1 - end" ]

  - section_name: break a
    duration_bars: 0
    elements:
      -
