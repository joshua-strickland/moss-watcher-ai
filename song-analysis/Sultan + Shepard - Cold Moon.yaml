        automation:
          its very cut off as section begins
          hi cut filter starts gradually expanding around 9.1.1 to nearly entirely open until verse b ends

      - category: Drums - Hats
        pattern:
          16th notes except for 1st 16th note of each beat.
          The velocity of each note is a bit different to create a more pronounced 2nd note in between the 1st and 3rd.
          This results in a sort of quiet-loud-quiet sound
        timing: 32.1.1 and on

