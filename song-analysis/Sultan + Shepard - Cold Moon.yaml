          the  tail rings out well into verse a
        timing: bar 16.4

      - category: Bass
        label: warm background intro bass
        pattern: on 1st beat of each bar
        tonality: very warm, sounds kinda like a piano actually, but just a singular low note
        timing: constant

      - category: Drums - Kick
        pattern: 4 on the floor
        pattern_variation: bar 16.3 kick cuts out entirely
        tonality:
