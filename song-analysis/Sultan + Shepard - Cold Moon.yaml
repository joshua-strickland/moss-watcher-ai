# yaml-language-server: $schema=./song-schema.json

track_metadata:
  artist: Sultan + Shepard
  title: Cold Moon
  key_signature: C Major
  bpm: 120
  time_signature: 4/4
  genre: Melodic House

sounds:
  swell_synth:
    category: Synth - Swell
    label: primary background synth swell
    tonality: simple verbed swell saw sound with slow attack

  gated_swell_riser:
    category: Transition - Riser
    label: primary background synth swell gated riser
    tonality:
      volume gated verbed synth, very similar to primary background synth swell

  swell_pad:
    category: Synth - Pad
    label: primary background synth swell gated riser tail / pad
    tonality: volume gated verbed synth, very similar to primary background synth swell.
      This seems to extend the tail of the primary background synth swell
      this is the pad form of the primary background synth swell. extremely similar tonally,
      basically the same but without a gate.

  resonant_pad:
    category: Synth - Pad
    tonality: high freq content =, simple saw reverb pad, potentially heavy boost on one particular high resonant frequency

  angelic_pad:
    category: Synth - Granular Pad
    tonality:
      very "angelic" sounding pad like lots of synth notes in harmony washed together with lots of reverb
      relatively quiet, in the background

  warm_pluck:
    category: Synth - Pluck
    label: main warm saw pluck
    tonality: simple warm saw hi cut pluck. some verb and 16th note delay

  rhythm_gated_synth:
    category: Synth - Sustained
    label: volume gated rhythm chord sustained synth
    tonality:
      fairly heavy hi cut filter applied to synth, prob saw
      a rhythmic 16th note volume gate
      this sounds very similar to the delay of the main warm saw pluck, however I believe it is distinct
      it focuses on a single note throughout I believe. though the main saw pluck also hits this same note, it does not do so constantly

  string_synth:
    category: Synth - Sustained
    tonality: string sounding synth, kindof muffled saw like sound

  shimmer_arp:
    category: Synth - Arp
    tonality: '"shimmering" saw lie plucking arp'

  strings:
    category: Strings - Violin
    tonality: string sample volume gated with quarter notes

  piano:
    category: Keys - Piano
    tonality: piano with sustain pedal pressed

  whoop_vocal:
    category: Vocals - Background
    tonality:
      tonal "whoop" sort of sound, saturation applies more heavily as sound lingers.
      sound lingers for approx a bar

  ey_chops:
    category: Vocals - Background
    tonality: '"ey" vowel sounding chops, fairly heavy reverb'

  ey_gated:
    category: Vocals - Background
    tonality: This may not be a vocal sample, but it sounds like a "ey" vowel sound volume gated

  all_i_need_vocals:
    category: Vocals - Background
    tonality: hi cut, reverb fx applied to background "all I need" vocal phrases

  distorted_vocal_chop:
    category: Vocals - Chop
    tonality:
      A very odd sounding what I think is a vocal chop sample but heavily distorted and bandpassed both high and low.

  harmony_vocals:
    category: Vocals - Lead
    tonality:
      harmony engine / vocal harmony tool adding many different harmonies at once.
      Has that auto tune / vocoder sort of synth sound to it.
      Gentle warm male vocals using intermittent falsettos

  gated_fx:
    category: FX - Synth
    label: rapid gated synth FX background sound
    tonality: rapid gated synth fx background sound.
      very rapid volume gate on it. serves as a transitory element

  very_rapid_gated_synth:
    category: FX - Synth
    label: very rapid volume gated synth
    tonality: incredibly fast volume gated swell like sound.

  uh_gated_vocal:
    category: FX - Synth
    tonality: a rapid volume gated vocal sample "uh" vowel sounding

  low_swell:
    category: Transition - Riser
    tonality: low end quick transitory swell into next phrase

  supersaw_riser:
    category: Transition - Riser
    label: supersaw like riser
    tonality: a heavily volume ducked / gated saw in sync with quarter notes

  saw_riser:
    category: Transition - Riser
    tonality: high frequency saw synth riser

  fast_riser:
    category: Transition - Riser
    label: Fast synth riser
    tonality: pan sweeping right to left
      lot of white noise sounding high freq content
      tonal, some sort of synth, probably a saw
      high passed, with a high cut filter that gradually ascends as the riser progresses
      rapid volume gate - 16th or 32nd notes

  siren_riser:
    category: Transition - Riser
    tonality: siren sounding simple synth riser. high passed around mid frequencies

  noise_sweep:
    category: Transition - Sweep
    tonality: basic noise sweep. very little mid / low frequency content. reverb tail rings into the next bar

  white_noise_sweep:
    category: Transition - Sweep
    tonality: basic white noise sweep layered on top of riser

  intro_bass:
    category: Bass
    label: warm background intro bass
    tonality: very warm, sounds kinda like a piano actually, but just a singular low note

  sub_bass:
    category: Bass
    label: warm sub bass
    tonality:
      very warm simple sine / sub.
      fundamental frequency appears to be around 45hz at lowest to 95 hz at highest
      frequency content overlaps with kick, specifically around 40-60 hz region,
      sidechain ducking with quarter notes attenuates, but doesn't entirely mute sound. ducking appears even across frequency spectrum
      there is a mid layer to the bass content, I think somewhere around 15-600 hz somewhere

  kick:
    category: Drums - Kick
    tonality:
      full low end content. prominent between 200-40hz, with some content all the way to 30 and even lower
      mid range content slightly attenuated
      I believe full range treble content - definite "click"
      fundamental freq content & tuning seems to be around 40-50hz

  reverb_kick:
    category: Drums - Kick
    label: break FX reverb kick
    tonality: A moderately low passed kick drum. Lots of reverb & long reverb tail.

  hats:
    category: Drums - Hats
    tonality: fairly heavily verbed, perhaps some hicut

  snare:
    category: Drums - Snare
    tonality: fairly heavy snare, barely any reverb if any

  buildup_snare:
    category: Drums - Snare
    label: snare buildup
    tonality:
      fairly simple snare, short ish tail, dying down before next snare hits so less than 1/8th note long
      snappy, but not a heavy snare

  clap:
    category: Drums - Clap
    tonality: prominent, heavy reverb fx with long reverb tail

  shaker:
    category: Drums - Shakers

  metallic_perc:
    category: Drums - Other Percussive
    tonality:
      metallic / almost hat sounding like percussives.
      each one has a fair bit of reverb to it

arrangement:
  - section_name: intro
    duration_bars: 16
    elements:
      - sound: swell_synth
        pattern: Hits on 1.1.1, 1.2.3, 1.3.3, 1.4.3, 2.2.3, 2.3.3 repeating this pattern every 2 bars.
        timing:
          active: ["1.1.1 - end"]

      - sound: warm_pluck
        pattern:
          3 16th notes in a row occurring at varying positions within the bar.
          notes ascend then come back to starting note
        automation: hi cut filter gradually ascends up the frequency spectrum
        timing:
          active: ["1.1.1 - end"]

      - sound: whoop_vocal
        pattern: once, but sounds delayed approx every quarter note
        timing:
          hits: ["8.1.1"]

      - sound: ey_chops
        pattern: eighth notes
        timing:
          hits: ["12.2.1"]

      - sound: gated_fx
        pattern: once
        timing:
          hits: ["4.3.1"]

      - sound: uh_gated_vocal
        pattern: 16th or 32nd notes
        timing:
          hits: ["14.3.1"]

      - sound: low_swell
        pattern: once
        timing:
          hits: ["16.4.1"]

      - sound: gated_swell_riser
        notes: the tail rings out well into verse a
        pattern: once
        timing:
          hits: ["16.4.1"]

      - sound: intro_bass
        pattern: on 1st beat of each bar
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: 4 on the floor
        timing:
          description: 16.3.1 kick cuts out entirely
          active: ["1.1.1 - end"]
          mutes: ["16.3.1 - end"]

      - sound: hats
        pattern:
          16th notes except for 1st 16th note of each beat.
          The velocity of each note is a bit different to create a more pronounced 2nd note in between the 1st and 3rd.
          This results in a sort of quiet-loud-quiet sound
        timing:
          active: ["8.2.1 - 9.1.1"]

  - section_name: verse a
    duration_bars: 48
    elements:
      - sound: swell_pad
        pattern: once
        timing:
          active: ["1.1.1 - end"]

      - sound: warm_pluck
        pattern:
          3 16th notes in a row occurring at varying positions within the bar.
          notes ascend then come back to starting note
        automation: hi cut ascends gradually.
          on 12.1.1 - 17.1.1, cut ascends more rapidly. resets on 17.1.1
        timing:
          active: ["1.1.1 - end"]

      - sound: rhythm_gated_synth
        pattern: 16th notes
        timing:
          active: ["1.1.1 - end"]

      - sound: resonant_pad
        timing:
          active: ["17.1.1 - end"]

      - sound: whoop_vocal
        pattern: once, but sounds delayed approx every quarter note
        timing:
          hits: ["8.1.1"]

      - sound: distorted_vocal_chop
        pattern: occurs on 1.3.1, 2.2.1, 3.1.1. This is 3 16th notes apart. It is a dotted eigth note pattern.
        timing:
          active: ["25.1.1 - end"]

      - sound: all_i_need_vocals
        timing:
          active: ["32.1.1 - 49.1.1"]

      - sound: supersaw_riser
        timing:
          hits: ["16.1.1"]

      - sound: very_rapid_gated_synth
        timing:
          hits: ["16.3.1"]

      - sound: noise_sweep
        timing:
          active: ["16.1.1 - 18.1.1"]

      - sound: strings
        timing:
          active: ["40.1.1 - 49.1.1"]

      - sound: saw_riser
        timing:
          active: ["44.1.1 - 49.1.1"]

      - sound: white_noise_sweep
        timing:
          active: ["44.1.1 - 49.1.1"]

      - sound: sub_bass
        notes: Comes in full force as verse a starts
        pattern: on 1st beat of each bar
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: 4 on the floor
        timing:
          description: 16.3.1 kick cuts out entirely
          active: ["1.1.1 - end"]
          mutes: ["16.3.1 - 17.1.1"]

      - sound: snare
        pattern: 4 on floor
        timing:
          active: ["9.1.1 - end"]

      - sound: clap
        pattern: once
        pattern_variation: on 8.4.4, clap occurs just before next phrase as transitory element
        timing:
          active: ["8.4.4 - end"]

      - sound: shaker
        pattern: 4 on floor + 2 16th notes every other beat.
          x.1.2, x.1.3, x.2.3, x.3.2, x.3.3, x.4.3
        timing:
          active: ["17.1.1 - end"]

      - sound: hats
        pattern:
          16th notes except for 1st 16th note of each beat.
          The velocity of each note is a bit different to create a more pronounced 2nd note in between the 1st and 3rd.
          This results in a sort of quiet-loud-quiet sound
        timing:
          active: ["32.1.1 - end"]

  - section_name: verse a outro
    duration_bars: 8
    global_transitions: all instruments gradually cut out near end of 8 bar section
    elements:
      - sound: warm_pluck
        pattern:
          3 16th notes in a row occurring at varying positions within the bar.
          notes ascend then come back to starting note
        automation: hi cut starts high and descends during the outro
        timing:
          active: ["1.1.1 - end"]

      - sound: rhythm_gated_synth
        pattern: 16th notes
        timing:
          active: ["1.1.1 - end"]

      - sound: all_i_need_vocals
        timing:
          active: ["1.1.1 - end"]

      - sound: gated_swell_riser
        notes: the tail rings out 2-6 bars into the break
        pattern: once
        timing:
          hits: ["8.1.1"]

      - sound: white_noise_sweep
        timing:
          hits: ["6.1.1"]

      - sound: sub_bass
        pattern: on 1st beat of each bar
        timing:
          active: ["1.1.1 - end"]

      - sound: hats
        pattern:
          16th notes except for 1st 16th note of each beat.
          The velocity of each note is a bit different to create a more pronounced 2nd note in between the 1st and 3rd.
          This results in a sort of quiet-loud-quiet sound
        automation: volume and low pass filter descends into things are almost quiet
        timing:
          active: ["1.1.1 - end"]

      - sound: snare
        pattern: 4 on floor
        automation: high pass filter gradually descends
        timing:
          active: ["1.1.1 - end"]

  - section_name: break
    duration_bars: 32
    elements:
      - sound: swell_synth
        pattern: Hits on 1.1.1, 1.2.3, 1.3.3, 1.4.3, 2.2.3, 2.3.3 repeating this pattern every 2 bars.
        automation: There is a low pass at a lower frequnecy cut off here
        timing:
          active: ["1.1.1 - end"]

      - sound: rhythm_gated_synth
        pattern: 16th notes
        automation: low pass filter set to a very low frequency as section begins
        timing:
          active: ["1.1.1 - end"]

      - sound: angelic_pad
        timing:
          active: ["3.1.1 - end"]

      - sound: swell_synth
        pattern: Hits on 1.1.1, 1.2.3, 1.3.3, 1.4.3, 2.2.3, 2.3.3 repeating this pattern every 2 bars.
        timing:
          active: ["5.1.1 - end"]

      - sound: fast_riser
        pattern: once
        automation: a high cut filter that gradually ascends as the riser progresses
        timing:
          active: ["7.1.1 - 9.1.1"]

      - sound: very_rapid_gated_synth
        timing:
          hits: ["32.3.1"]

      - sound: ey_gated
        timing:
          description: constant?
          active: ["1.1.1 - end"]

      - sound: sub_bass
        notes: perhaps some mid bass layers. volume quieter relative to other sections
        timing:
          active: ["9.1.1 - 26.1.1"]

      - sound: harmony_vocals
        timing:
          active: ["9.1.1 - end"]

      - sound: metallic_perc
        pattern: eighth notes
        timing:
          description: 15.1.1 - 17.1.1,
            again at 24.1.1 as 4 eighth notes in a row lasting 2 beats, transitory element leading into next phrase
          active: ["15.1.1 - 17.1.1", "24.1.1 - 24.3.1"]

      - sound: piano
        timing:
          active: ["17.1.1 - end"]

      - sound: strings
        timing:
          active: ["25.1.1 - end"]

      - sound: reverb_kick
        pattern: once
        timing:
          hits: ["1.1.1"]

  - section_name: verse b buildup
    duration_bars: 32
    global_transitions: every instrument cuts out at 32.1.1, leaving just some reverb tails ringing until verse b.
    elements:
      - sound: kick
        notes:
          I think this is the same kick, but heavily filtered so its rather muffled.
          both low end & high end seem cut
        pattern: 4 on the floor
        pattern_variation: 32.4.1 kick occurs with transitionary fill  to final verse
        timing:
          active: ["1.1.1 - 32.1.1"]

      - sound: warm_pluck
        pattern:
          3 16th notes in a row occurring at varying positions within the bar.
          notes ascend then come back to starting note
        automation:
          this section the hi cut filter is at a pretty low frequency cutoff
          hi cut filter gradually ascends up the frequency spectrum
        timing:
          active: ["1.1.1 - end"]

      - sound: strings
        timing:
          active: ["1.1.1 - end"]

      - sound: string_synth
        timing:
          active: ["5.1.1 - end"]

      - sound: buildup_snare
        pattern: eighth notes
        pattern_variation: 32.4.1 snare occurs with transitionary fill to final verse
        timing:
          active: ["17.1.1 - 32.1.1"]

      - sound: siren_riser
        timing:
          active: ["25.1.1 - 32.1.1"]

  - section_name: verse b
    duration_bars: 16
    elements:
      - sound: warm_pluck
        pattern:
          3 16th notes in a row occurring at varying positions within the bar.
          notes ascend then come back to starting note
        automation:
          the cutoff frequency begins at or near a high frequency, near or at where the verse b build up automation stopped
          it rises more gradually to expand the filter almost entirely near the end, just prior to the outro
        timing:
          active: ["1.1.1 - end"]

      - sound: sub_bass
        pattern: on 1st beat of each bar
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - 16.1.1"]

      - sound: shimmer_arp
        automation:
          its very cut off as section begins
          hi cut filter starts gradually expanding around 9.1.1 to nearly entirely open until verse b ends
        timing:
          active: ["1.1.1 - end"]

      - sound: hats
        pattern:
          16th notes except for 1st 16th note of each beat.
          The velocity of each note is a bit different to create a more pronounced 2nd note in between the 1st and 3rd.
          This results in a sort of quiet-loud-quiet sound
        timing:
          active: ["1.1.1 - end"]

      - sound: snare
        pattern: 4 on floor
        automation: on 16.1.1, low end seems cut from sound during transition to outro
        timing:
          active: ["9.1.1 - end"]

      - sound: noise_sweep
        timing:
          active: ["15.1.1 - 17.1.1"]

  - section_name: Outro
    duration_bars: 32
    global_transitions: at bar 16, everything but the kick cut out
    elements:
      - sound: rhythm_gated_synth
        pattern: 16th notes
        automation: the cutoff frequency is a tad lower I think than in verse a
        timing:
          active: ["1.1.1 - end"]

      - sound: angelic_pad
        notes: multitonal synth wash / reverb like sound. volume ducked to quarter notes / with kick
        pattern: pad
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        notes: full presence
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]
