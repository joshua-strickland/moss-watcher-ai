        tonality: simple warm saw hi cut pluck. some verb and 16th note delay
        pattern:
          3 16th notes in a row occurring at varying positions within the bar.
          notes ascend then come back to starting note
        timing: constant
        automation: hi cut filter gradually ascends up the frequency spectrum

      - category: Vocals - Background
        pattern: once, but sounds delayed approx every quarter note
        timing: bar 8
        tonality:
          tonal "whoop" sort of sound, saturation applies more heavily as sound lingers.
          sound lingers for approx a bar

      - category: Vocals - Background
        pattern: eighth notes
        tonality: "ey" vowel sounding chops, fairly heavy reverb
        timing: bar 12.2

      - category: FX - Synth
        label: rapid gated synth FX background sound
        pattern: once
        tonality: rapid gated synth fx background sound.
          very rapid volume gate on it. serves as a transitory element
        timing: bar 4.3

      - category: FX - Synth
        pattern: 16th or 32nd notes
        tonality: a rapid volume gated vocal sample "uh" vowel sounding
        timing: bar 14.3

      - category: Transition - Riser
        pattern: once
