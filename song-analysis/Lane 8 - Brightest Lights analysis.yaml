# yaml-language-server: $schema=./song-schema.json

track_metadata:
  artist: Lane 8
  title: Brightest Lights
  key_signature: D# Major
  bpm: 125
  time_signature: 4/4
  genre: Melodic House

sounds:
  reverse_swell:
    category: Transition - Sweep
    label: Reverse Swell
    tonality: Reverse sound.

  main_kick:
    category: Drums - Kick
    label: Main Kick
    tonality: Standard foundational kick.

  sub_kick:
    category: Drums - Kick
    label: Sub Kick
    tonality: Real subtle, low cutoff.

  lfo_pad:
    category: Synth - Pad
    label: LFO Pad
    tonality: Synthesizer pad with heavy modulation.

  post_intro_pad:
    category: Synth - Pad
    label: Post Intro Pad
    tonality: Smooth sustaining pad.

  ringing_pad:
    category: Synth - Pad
    label: Ringing Pad
    tonality: Resonant, ringing pad character.

  verse_break_pad:
    category: Synth - Pad
    label: Verse Break Pad
    tonality: Softer pad, not ringy.

  vocal_fx:
    category: Vocals - Atmosphere
    label: Vocal FX
    tonality: Processed human voice.

  steel_drum_melody:
    category: Drums - Other Percussive
    label: Steel Drum Melody
    tonality: Cutoff steel drums character.

  harmonic_percussion:
    category: Drums - Other Percussive
    label: Harmonic Percussion
    tonality: Percussive element containing harmonic content.

  main_hats:
    category: Drums - Hats
    label: Main Hats
    tonality: Standard hi-hats.

  secondary_hats:
    category: Drums - Hats
    label: Secondary Hats
    tonality: Light open hats.

  transition_hats:
    category: Drums - Hats
    label: Transition Hats
    tonality: Open hi-hat.

  warm_synth:
    category: Synth - Sustained
    label: Warm Synth
    tonality: Warm synthesizer sound using distortion.

  telephone_synth:
    category: Synth - Sustained
    label: Telephone Synth
    tonality: Warm, cutoff telephone ring character.

  automated_pluck:
    category: Synth - Pluck
    label: Automated Pluck
    tonality: Light plucky synth.

  plucks:
    category: Synth - Pluck
    label: Plucks
    tonality: Plucky melodic synth.

  percussive_snare:
    category: Drums - Snare
    label: Percussive Snare
    tonality: Percussive snare-like element.

  main_vocals:
    category: Vocals - Lead
    label: Main Vocals
    tonality: Clear lead vocal.

  vocal_harmony:
    category: Vocals - Lead
    label: Vocal Harmony
    tonality: Harmonized vocal layer.

  outro_vocals:
    category: Vocals - Lead
    label: Outro Vocals
    tonality: Atmospheric "whoo oo oo oo" vocal lines.

arrangement:
  - section_name: Intro
    duration_bars: 32
    elements:
      - sound: reverse_swell
        pattern: Swells right away on the first beat.
        timing:
          hits: ["1.1.1"]
      - sound: main_kick
        pattern: Four-on-the-floor rhythm.
        timing:
          active: ["1.2.1 - end"]
      - sound: lfo_pad
        pattern: Quarter notes.
        timing:
          active: ["1.1.1 - end"]
      - sound: vocal_fx
        pattern: Occurs intermittently throughout the section.
        timing:
          active: ["1.1.1 - end"]
      - sound: steel_drum_melody
        pattern: Subtle percussive melody.
        timing:
          active: ["1.1.1 - end"]
      - sound: main_hats
        pattern: Rhythmic hat pattern introduced.
        timing:
          active: ["9.1.1 - end"]
      - sound: harmonic_percussion
        pattern: Interlocking rhythm.
        timing:
          active: ["17.1.1 - end"]
      - sound: secondary_hats
        pattern: Additional hat rhythm that leads into the post intro.
        timing:
          active: ["25.1.1 - end"]

  - section_name: Post Intro
    duration_bars: 16
    global_transitions: >
      1.1.1: Kick drum exits completely.
    elements:
      - sound: vocal_fx
        pattern: Continues intermittently.
        timing:
          active: ["1.1.1 - end"]
      - sound: warm_synth
        pattern: Comes and goes throughout the section.
        automation: Distortion becomes more aggressive from 9.1.1 - 17.1.1
        timing:
          active: ["1.1.1 - end"]
      - sound: sub_kick
        pattern: Soft driving beat.
        timing:
          active: ["9.1.1 - end"]
      - sound: post_intro_pad
        pattern: Background texture.
        timing:
          active: ["9.1.1 - end"]

  - section_name: Preverse
    duration_bars: 16
    elements:
      - sound: main_kick
        notes: Not cutoff.
        pattern: Four-on-the-floor rhythm.
        timing:
          active: ["1.1.1 - 15.1.1"]
      - sound: lfo_pad
        notes: Lighter.
        pattern: Quarter notes, comes and goes.
        timing:
          active: ["1.1.1 - end"]
      - sound: automated_pluck
        pattern: Intermittent phrasing.
        automation: Volume automated in and out.
        timing:
          active: ["1.1.1 - end"]
      - sound: vocal_fx
        notes: Subtle.
        pattern: Light background presence.
        timing:
          active: ["1.1.1 - end"]
      - sound: percussive_snare
        pattern: Hits strictly on the 2nd beats.
        timing:
          active: ["9.1.1 - end"]
      - sound: transition_hats
        pattern: Ascending rhythm leading into the verse.
        timing:
          active: ["15.1.1 - end"]

  - section_name: Verse A
    duration_bars: 24
    chord_progression: "VI - VII - I - III - II, VI - VII - I - III - V"
    global_transitions: >
      17.1.1: Kicks and plucks exit for the verse break.
    elements:
      - sound: main_vocals
        pattern: Main melody lines enter.
        timing:
          active: ["1.1.1 - end"]
      - sound: main_kick
        pattern: Four-on-the-floor rhythm.
        timing:
          active: ["1.1.1 - 17.1.1"]
      - sound: main_hats
        pattern: Top rhythmic layer.
        timing:
          active: ["1.1.1 - 17.1.1"]
      - sound: plucks
        pattern: Core accompaniment.
        timing:
          active: ["1.1.1 - 17.1.1"]
      - sound: ringing_pad
        pattern: Pings specifically on beat 1 and 2a.
        timing:
          active: ["1.1.1 - 17.1.1"]
      - sound: verse_break_pad
        pattern: Replaces the ringing pad for the vocal break.
        timing:
          active: ["17.1.1 - end"]

  - section_name: Chorus A
    duration_bars: 24
    elements:
      - sound: main_vocals
        notes: Sings "all the brightest lights".
        pattern: Sings main chorus phrasing.
        timing:
          active: ["1.1.1 - end"]
      - sound: vocal_harmony
        pattern: Accompanies the main vocal melody.
        timing:
          active: ["9.1.1 - 17.1.1"]
      - sound: outro_vocals
        pattern: Ethereal phrasing.
        timing:
          active: ["17.1.1 - end"]
      - sound: plucks
        notes: A bit less cutoff than in Verse A.
        pattern: Core melodic rhythm.
        timing:
          active: ["1.1.1 - 15.1.1"]
      - sound: main_kick
        pattern: Four-on-the-floor.
        timing:
          active: ["1.1.1 - 15.1.1"]
      - sound: telephone_synth
        pattern: New melodic synthesizer element.
        timing:
          active: ["17.1.1 - end"]

  - section_name: Verse B
    duration_bars: 8
    elements:
      - sound: main_vocals
        pattern: Follows Verse A structure.
        timing:
          active: ["1.1.1 - end"]
      - sound: plucks
        pattern: Core accompaniment.
        timing:
          active: ["1.1.1 - end"]
      - sound: main_hats
        pattern: Top rhythmic layer.
        timing:
          active: ["1.1.1 - end"]
      - sound: main_kick
        pattern: Half-time; half-notes instead of quarter-notes.
        timing:
          active: ["2.1.1 - end"]
