# yaml-language-server: $schema=./song-schema.json

track_metadata:
  artist: Porter Robinson
  title: Is there really no happiness
  key_signature: F#/Gb Major
  bpm: 98
  time_signature: 4/4
  genre: Electropop / Indietronica

sounds:
  piano:
    category: Keys - Piano

  distorted_pad:
    category: Synth - Pad
    tonality: distorted / saturated, like a pad fed through a guitar amp

  kick:
    category: Drums - Kick
    tonality: full presence

  hats:
    category: Drums - Hats
    tonality: full presence

  snare:
    category: Drums - Snare
    tonality:
      sounds like a layer of a tacky edm snare and an actual full body snare.
      fair amount of low end

  clap:
    category: Drums - Clap

  ride:
    category: Drums - Rides

  noise_sweep:
    category: Transition - Sweep
    tonality: ascending frequency white noise sweep

  bass:
    category: Bass
    tonality: bass guitar feels like it has tons of space in frequency spectrum. amazing

  female_vocal_pad:
    category: Vocals - Atmosphere
    tonality: >
      female vocals hover with a good amount of reverb,
      breathy Aaa vowels.
      rhythmically volume gated

  male_vocal_gate:
    category: Vocals - Atmosphere
    tonality: male voice volume gated

  lead_vocals:
    category: Vocals - Lead

  acoustic_guitar:
    category: Guitar - Acoustic

  background_arp:
    category: Synth - Arp
    tonality: gentle, slightly low passed saw like plucky lead / arp in the background

arrangement:
  - section_name: Intro
    duration_bars: 4
    global_transitions: on 4.3.1, everything cuts out. On 4.4.1, 2 eighth note muted guitar string strums are hit.
    elements:
      - sound: piano
        notes: band passed piano
        timing:
          active: ["1.1.1 - 5.2.1"]
      - sound: distorted_pad
        timing:
          active: ["1.1.1 - 5.2.1"]
      - sound: kick
        notes: low passed kick drum
        automation: low pass ascends until global transition
        timing:
          active: ["3.1.1 - 5.2.1"]
      - sound: noise_sweep
        timing:
          active: ["4.1.1 - 4.2.1"]

  - section_name: Intro 2 / Intro chorus
    duration_bars: 9
    global_transitions:
      9.1.1 exists as a transitory bar, only bass and drums are active
    elements:
      - sound: bass
        timing:
          active: ["1.1.1 - end"]
      - sound: female_vocal_pad
        pattern: >
          primarily the volume gated vocals are present
          with overlapping melodies being played occasionally.
        timing:
          active: ["1.1.1 - 9.1.1"]
      - sound: kick
        timing:
          active: ["1.1.1 - end"]
      - sound: hats
        pattern: 16th note fills interchange with constant 8th notes
        timing:
          active: ["1.1.1 - end"]
      - sound: snare
        timing:
          active: ["1.1.1 - end"]
      - sound: piano
        timing:
          active: ["1.1.1 - 9.1.1"]

  - section_name: verse a
    duration_bars: 16
    elements:
      - sound: acoustic_guitar
        timing:
          active: ["1.1.1 - end"]
      - sound: kick
        notes: more muted / soft than in chorus
        timing:
          active: ["1.1.1 - end"]
      - sound: hats
        pattern: 16th note fills interchange with constant 8th notes
        timing:
          active: ["1.1.1 - end"]
      - sound: snare
        timing:
          active: ["1.1.1 - end"]
      - sound: clap
        pattern_variation: 16th note fill leads into break a
        timing:
          active: ["1.1.1 - end"]
      - sound: lead_vocals
        timing:
          active: ["1.1.1 - end"]
      - sound: bass
        notes: almost like low end is cut, sounds kinda acoustic somewhat
        timing:
          active: ["9.1.1 - end"]
      - sound: piano
        timing:
          active: ["1.1.1 - end"]

  - section_name: break a
    duration_bars: 8
    global_transitions: on 4.3.1, everything cuts out,
    elements:
      - sound: acoustic_guitar
        timing:
          active: ["1.1.1 - end"]
      - sound: kick
        notes: more muted / soft than in chorus
        timing:
          active: ["1.1.1 - end"]
      - sound: hats
        pattern: 16th note fills interchange with constant 8th notes
        pattern_variation: fill with open hats occurs on 4.1.1 - 4.2.1
        timing:
          active: ["1.1.1 - end"]
      - sound: ride
        pattern: 8th note
        timing:
          active: ["1.1.1 - end"]
      - sound: snare
        pattern_variation: 16th note fill 4.3.3 - 4.4.3
        timing:
          active: ["1.1.1 - end"]
      - sound: male_vocal_gate
        timing:
          active: ["1.1.1 - end"]
      - sound: lead_vocals
        notes: male voice lead rings in loud and clear
        pattern: matches snare fill, 8th / 16th notes
        timing:
          active: ["8.3.1 - 8.4.1"]
      - sound: bass
        notes: almost like low end is cut, sounds kinda acoustic somewhat
        pattern_variation: 32nd / 16th note prior to verse bass slides in again to transition
        timing:
          active: ["1.1.1 - end"]
      - sound: piano
        timing:
          active: ["1.1.1 - end"]

  - section_name: chorus a
    duration_bars: 8
    elements:
      - sound: bass
        timing:
          active: ["1.1.1 - end"]
      - sound: lead_vocals
        timing:
          active: ["1.1.1 - end"]
      - sound: kick
        timing:
          active: ["1.1.1 - end"]
      - sound: hats
        pattern: 16th note fills interchange with constant 8th notes
        timing:
          active: ["1.1.1 - end"]
      - sound: ride
        pattern: 8th note
        timing:
          active: ["1.1.1 - end"]
      - sound: snare
        timing:
          active: ["1.1.1 - end"]
      - sound: piano
        timing:
          active: ["1.1.1 - end"]
      - sound: background_arp
        timing:
          active: ["1.1.1 - end"]

  - section_name: Chorus A outro
    duration_bars: 9
    global_transitions:
      Bar 9 exists as a transitory bar, only bass and drums are active
    elements:
      - sound: bass
        timing:
          active: ["1.1.1 - end"]
      - sound: female_vocal_pad
        pattern: >
          primarily the volume gated vocals are present
          with overlapping melodies being played occasionally.
        timing:
          active: ["1.1.1 - 9.1.1"]
      - sound: kick
        timing:
          active: ["1.1.1 - end"]
      - sound: hats
        pattern: 16th note fills interchange with constant 8th notes
        timing:
          active: ["1.1.1 - end"]
      - sound: snare
        timing:
          active: ["1.1.1 - end"]
      - sound: piano
        timing:
          active: ["1.1.1 - 9.1.1"]
