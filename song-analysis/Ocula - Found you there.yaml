  - section_name: bridge
    duration_bars: 2
    chord_progression: unsure
    global_transitions: synth lead reverb trails ring out.
    elements:
      - sound: lead_vocal
        pattern: eighth notes
        timing:
          hits: ["2.3.3"]

  - section_name: Verse B
