# yaml-language-server: $schema=./song-schema.json

track_metadata:
  artist: Ocula
  title: Found you there
  key_signature: C Major
  bpm: 122
  time_signature: 4/4
  genre: Melodic House

sounds:
  tremolo_warm_saw:
    category: Synth - Pad
    label: tremolo warm saw
    tonality: >
      Warm cut off, tremolo'd sawtooth synthesizer.

  tremolo_shimmer_pad:
    category: Synth - Pad
    label: tremolo shimmer pad
    tonality: >
      High frequency content saw / similar synth gated with pseudo random rhythm.
      layered with tremolo warm saw

  trumpet_pad:
    category: Synth - Pad
    tonality: Sounds kinda like a trumpet

  main_arp:
    category: Synth - Arp
    label: Main 16th Arp
    tonality: >
      Plucky synthesizer sharing notes with the piano melody.

  background_vocals:
    category: Vocals - Atmosphere
    label: background verbed background vocals
    tonality: >
      Female vocal with a lush reverb tail. heavy cutoff

  lead_vocal:
    category: Vocals - Lead
    tonality: clean, unfiltered

  muffled_vocal_chops:
    category: Vocals - Chop
    tonality: muffled sounding vocal chops like in intro

  vowel_chops:
    category: Vocals - Chop
    tonality: vowel chops, breathy, maybe some noise, slight reverb

  kick:
    category: Drums - Kick
    tonality: not super punchy, not super soft, right in the middle

  hats:
    category: Drums - Hats
    tonality: alternates in velocity, ranges from heavy to soft.

  snare:
    category: Drums - Snare
    tonality: Slappy, "paper-y" Not a super long tail, no verb?

  speaker_pops:
    category: Drums - Other Percussive
    label: gentle speaker pops
    tonality: like a vinyl crackle or low quality speaker pops with low filter

  cutoff_toms:
    category: Drums - Other Percussive
    label: cutoff toms
    tonality: a muted tom-like sound heavily cut off, descending

  warm_bass:
    category: Bass
    tonality: very warm gentle bass, sub and maybe mid bass

  intro_riser:
    category: Transition - Riser
    label: intro to verse riser
    tonality: band passed pad like saw

  lead_pluck:
    category: Synth - Pluck
    label: lead cutoff warm saw pluck
    tonality: warm cut off saw pluck

  cutoff_sustained_saw:
    category: Synth - Sustained
    label: cut off sustained saw
    tonality: cut off sustained saw

  sonar_synth:
    category: Synth - Sustained
    tonality: warm siren sonar sounding sustained background synth

  warm_bell_synth:
    category: Synth - Pluck
    label: warm bell synth
    tonality: bell like synth, cut off, very much in the background, delicate

arrangement:
  - section_name: Intro
    duration_bars: 16
    chord_progression: ""
    elements:
      - sound: tremolo_warm_saw
        pattern: >
          pad
        timing:
          active: ["1.1.1 - end"]
      - sound: tremolo_shimmer_pad
        pattern: >
          gated with pseudo random rhythm, otherwise constant
        timing:
          active: ["1.1.1 - end"]
      - sound: main_arp
        pattern: >
          16th-note arpeggiated rhythm.
        automation: >
          Low pass filter gradually opens up.
        timing:
          active: ["1.1.1 - end"]
      - sound: background_vocals
        pattern: >
          inconsistent
        timing:
          active: ["1.1.1 - end"]
      - sound: kick
        notes: soft intro kick, heavily cut off
        pattern: 4 on the floor
        timing:
          description: kick is absent on 16.4.1 as a transitory pattern shift
          active: ["5.1.1 - end"]
          mutes: ["16.4.1"]

      - sound: speaker_pops
        pattern: seemingly random
        timing:
          active: ["5.1.1 - end"]

      - sound: warm_bass
        pattern: primarily changes every bar, but intermittently changes on quarter notes
        timing:
          active: ["9.1.1 - end"]

      - sound: intro_riser
        pattern: note descends approx one interval once after 15th bar
        timing:
          description: 15.1.1 - 17.1.1 or so?
          active: ["15.1.1 - end"]

      - sound: trumpet_pad
        pattern: pad
        automation: cutoff gradually changes
        timing:
          active: ["9.1.1 - end"]

      - sound: hats
        notes: transitory
        pattern: 16th notes
        timing:
          hits: ["16.4.1"]

      - sound: lead_vocal
        pattern: transitionary timing occurring on final bar beat 3 "And"
        timing:
          hits: ["16.3.3"]

  - section_name: Verse A
    duration_bars: 16
    chord_progression: unsure
    elements:
      - sound: warm_bass
        pattern: primarily changes every bar, but intermittently changes on quarter notes
        timing:
          active: ["1.1.1 - end"]
      - sound: kick
        automation: cut off filter expands as soon as verse a begins allowing full frequency presence
        pattern: >
          4 on the floor
        timing:
          active: ["1.1.1 - end"]
          mutes: ["16.4.1"]
      - sound: hats
        pattern: >
          primarily occurs on eigth notes with 4 on the floor pattern.
          heavier quarter note hits occur on beats 1 & 3, while beats 2 and 4 utilize softer hits
          eighth note hits are softer
        pattern_variation:
          16th note fills lasting approx 1 beat are utilized as transitory rhythms leading to subsequent bars. IE on 2.4.1
        timing:
          active: ["1.1.1 - end"]
      - sound: snare
        pattern: beats 2 & 4
        timing:
          active: ["1.1.1 - end"]
      - sound: tremolo_shimmer_pad
        pattern: >
          gated with pseudo random rhythm, otherwise constant
        timing:
          active: ["1.1.1 - end"]
      - sound: lead_pluck
        pattern: >
          alternates between quarter and eighth notes.
          more rapid notes occur primarily during transitory rhythms leading to subsequent bars.
          goes to 16th notes as well during some transitory rhythms
        timing:
          active: ["1.1.1 - end"]
      - sound: lead_vocal
        pattern: Plays as transitory, occurring on the "And" of beats 3 or 2
        timing:
          active: ["1.1.1 - end"]

