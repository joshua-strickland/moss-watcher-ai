# yaml-language-server: $schema=./song-schema.json

track_metadata:
  artist: Ocula
  title: Leave your mark
  key_signature: C Major
  bpm: 126
  time_signature: 4/4
  genre: Melodic House

sounds:
  foley_wisps:
    category: FX - Foley
    label: Foley wisp pad things
    tonality: >
      Soft, wispy, and ethereal sound effects.

  sub_bass:
    category: Bass
    label: Sub Bass
    tonality: Bass

  bass:
    category: Bass
    tonality: mid & sub bass

  kick:
    category: Drums - Kick
    label: Kick
    tonality: >
      Kick drum, punchy, high transient and treble content

  soft_snare:
    category: Drums - Snare
    label: soft snare
    tonality: >
      soft ish snare

  mid_snare:
    category: Drums - Snare
    tonality: mid

  hard_snare:
    category: Drums - Snare
    label: hard snare
    tonality: >
      heavy transient hard hitting snare, very pounchy

  hats:
    category: Drums - Hats
    label: Hats
    tonality: >
      soft open ish hat

  rapid_hats:
    category: Drums - Hats
    label: rapid 16th note hats
    tonality: unfiltered

  upbeat_hats:
    category: Drums - Hats
    label: upbeat hats
    tonality: harder hit than rapid 16th hats

  shimmer_pad:
    category: Synth - Pad
    label: ethereal glassy shimmer pad
    tonality: >
      a mid-high saw synth pad, band passed to occupy limited frequnecy range
      volume gated at a pseudo random pattern to sort of "shimmer"
      reverbed

  lead_pluck:
    category: Synth - Pluck
    label: Main synth lead pluck
    tonality: plucked saw lead

  supersaw_lead:
    category: Synth - Supersaw
    label: rapid super saw lead
    tonality: breathy, airy saw with a high transient

  oooo_vocals:
    category: Vocals - Atmosphere
    label: Oooo verbed out vocals
    tonality: >
      Soft, and ethereal heavily verbed vocals in the background.

  main_vocals:
    category: Vocals - Lead
    label: main vocals
    tonality: falsetto - very soft male voice, lush reverb that rings out

  bass_sweep:
    category: Transition - Sweep
    label: bass sweep
    tonality: sortof like a reverse kick, low end heavy sweep

arrangement:
  - section_name: Pre-Intro
    duration_bars: 4
    chord_progression: no harmonic elements
    elements:
      - sound: foley_wisps
        pattern: >
          Occurs throughout this minor section
        timing:
          active: ["1.1.1 - end"]
      - sound: sub_bass
        pattern: swell
        automation:
          simple volume swell
        timing:
          hits: ["4.1.1"]

  - section_name: Intro
    duration_bars: 8
    chord_progression: unknown
    elements:
      - sound: kick
        notes: hi cut kick
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]

      - sound: shimmer_pad
        pattern: pad, oscillates between 2 notes
        timing:
          active: ["1.1.1 - end"]

      - sound: lead_pluck
        pattern: >
          eighth notes
          the pluck pattern uses a 16th note after the 2 A beat
          and the 4 beat to cutoff the pluck a bit faster than
          at other parts of the melody.
        automation:
          The cutoff gradually opens
        timing:
          active: ["1.1.1 - end"]

      - sound: oooo_vocals
        pattern: half note / quarter note
        timing:
          active: ["1.1.1 - end"]

  - section_name: Verse A
    duration_bars: 16
    chord_progression: ""
    elements:
      - sound: lead_pluck
        pattern: >
          eighth notes
          the pluck pattern uses a 16th note after the 2 A beat
          and the 4 beat to cutoff the pluck a bit faster than
          at other parts of the melody.
        automation:
          The cutoff gradually opens, faster than in intro
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: >
          quarter notes / 4 on the floor
        timing:
          active: ["1.1.1 - end"]

      - sound: hats
        pattern: >
          quarter notes
        timing:
          active: ["1.1.1 - end"]

      - sound: soft_snare
        pattern: >
          2nd & 4th beats
        timing:
          active: ["1.1.1 - end"]

      - sound: supersaw_lead
        pattern: rapid 16th notes, pausing for a 16th note around the And of beat 2
        automation: starts muted and volume & hi cut rise as final bar approaches
        timing:
          active: ["13.1.1 - end"]

      - sound: main_vocals
        pattern: eihgth notes primarily, some gaps for space
        timing:
          active: ["1.1.1 - end"]

  - section_name: bridge a
    duration_bars: 24
    chord_progression: unknown
    elements:
      - sound: supersaw_lead
        pattern: rapid 16th notes, pausing for a 16th note around the And of beat 2
        automation: starts muted and volume & hi cut rise as final bar approaches
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: >
          quarter notes / 4 on the floor
        timing:
          active: ["1.1.1 - end"]

      - sound: rapid_hats
        pattern: >
          16th notes, harder hits occurring on quarter notes
        timing:
          active: ["5.1.1 - end"]
          mutes: ["8.4.1"]

      - sound: upbeat_hats
        pattern: >
          upbeats/ "And"s
        timing:
          active: ["17.1.1 - end"]

      - sound: mid_snare
        pattern: beats 2 and 4
        timing:
          description: starts on 16.2.1
          active: ["16.2.1 - end"]

      - sound: bass
        pattern: matches rapid super saw lead, but does not cut out completely on 16ths
        timing:
          active: ["8.1.1 - end"]

  - section_name: verse b
    duration_bars: 16
    chord_progression: unknown
    elements:
      - sound: supersaw_lead
        pattern: rapid 16th notes, pausing for a 16th note around the And of beat 2
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: >
          quarter notes / 4 on the floor
        timing:
          active: ["3.1.1 - 13.1.1"]

      - sound: rapid_hats
        pattern: >
          16th notes, harder hits occurring on quarter notes
        timing:
          active: ["1.1.1 - end"]

      - sound: upbeat_hats
        pattern: >
          upbeats/ "And"s
        timing:
          active: ["9.1.1 - end"]

      - sound: mid_snare
        pattern: beats 2 and 4
        timing:
          active: ["1.1.1 - end"]

      - sound: bass
        pattern: matches rapid super saw lead, but does not cut out completely on 16ths
        timing:
          active: ["1.1.1 - end"]

      - sound: main_vocals
        pattern: quarter / eighth notes primarily, some gaps for space
        timing:
          active: ["1.1.1 - end"]

  - section_name: verse b outro
    chord_progression: unknown
    duration_bars: 8
    elements:
      - sound: kick
        automation: low pass filter descends gradually
        timing:
          active: ["1.1.1 - end"]

      - sound: main_vocals
        pattern: quarter / eighth notes primarily, some gaps for space
        timing:
          active: ["1.1.1 - end"]

      - sound: shimmer_pad
        pattern: pad, oscillates between 2 notes
        timing:
          active: ["1.1.1 - end"]

      - sound: supersaw_lead
        pattern: rapid 16th notes, pausing for a 16th note around the And of beat 2.
          the note pattern progresses to a more static 16th note rhythm on a single note
        automation: >
          hi cut is lower upon section start.
          volume and potentially cutoff gradually lower
          and the final notes ring out for a few bars into the next section
        timing:
          active: ["1.1.1 - 17.1.1"]

  - section_name: break
    duration_bars: 16
    elements:
      - sound: main_vocals
        pattern: quarter / eighth notes primarily, some gaps for space
        timing:
          active: ["1.1.1 - end"]

      - sound: lead_pluck
        pattern: >
          eighth notes
          the pluck pattern uses a 16th note after the 2 A beat
          and the 4 beat to cutoff the pluck a bit faster than
          at other parts of the melody.
        automation:
          The cutoff gradually opens
        timing:
          active: ["1.1.1 - end"]

      - sound: shimmer_pad
        pattern: pad, oscillates between 2 notes
        timing:
          active: ["1.1.1 - end"]

  - section_name: Verse C
    duration_bars: 16
    chord_progression: ""
    global_transitions: >
      sub sweep occurs near end of section
    elements:
      - sound: lead_pluck
        pattern: >
          eighth notes
          the pluck pattern uses a 16th note after the 2 A beat
          and the 4 beat to cutoff the pluck a bit faster than
          at other parts of the melody.
        automation:
          The cutoff gradually opens, faster than in intro
        timing:
          active: ["1.1.1 - end"]

      - sound: bass
        notes: soft
        pattern: similar to main synth lead pluck
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: >
          quarter notes / 4 on the floor
        timing:
          active: ["1.1.1 - end"]

      - sound: soft_snare
        pattern: >
          2nd & 4th beats
        timing:
          active: ["1.1.1 - end"]

      - sound: supersaw_lead
        pattern: rapid 16th notes, pausing for a 16th note around the And of beat 2
        automation: starts muted and volume & hi cut rise as final bar approaches
        timing:
          active: ["13.1.1 - end"]

      - sound: main_vocals
        pattern: eighth notes primarily, some gaps for space
        timing:
          active: ["1.1.1 - end"]

  - section_name: bridge b
    duration_bars: 16
    elements:
      - sound: supersaw_lead
        pattern: rapid 16th notes, pausing for a 16th note around the And of beat 2
        automation: starts muted and volume & hi cut rise as final bar approaches
        timing:
          active: ["1.1.1 - end"]

      - sound: bass
        notes: soft
        pattern: same as rapid super saw lead
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: >
          quarter notes / 4 on the floor
        timing:
          active: ["3.1.1 - end"]

      - sound: hard_snare
        pattern: >
          2nd & 4th beats
        timing:
          active: ["3.1.1 - end"]

      - sound: rapid_hats
        pattern: >
          16th notes, harder hits occurring on quarter notes
        timing:
          active: ["3.1.1 - end"]
          mutes: ["8.4.1"]

      - sound: upbeat_hats
        pattern: >
          upbeats/ "And"s
        timing:
          active: ["9.1.1 - end"]

  - section_name: verse d
    duration_bars: 16
    chord_progression: unknown
    elements:
      - sound: supersaw_lead
        pattern: rapid 16th notes, pausing for a 16th note around the And of beat 2
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: >
          quarter notes / 4 on the floor
        timing:
          active: ["3.1.1 - 13.1.1"]

      - sound: rapid_hats
        pattern: >
          16th notes, harder hits occurring on quarter notes
        timing:
          active: ["1.1.1 - end"]

      - sound: upbeat_hats
        pattern: >
          upbeats/ "And"s
        timing:
          active: ["9.1.1 - end"]

      - sound: mid_snare
        pattern: beats 2 and 4
        timing:
          active: ["1.1.1 - end"]

      - sound: bass
        pattern: matches rapid super saw lead, but does not cut out completely on 16ths
        timing:
          active: ["1.1.1 - end"]

      - sound: main_vocals
        pattern: quarter / eighth notes primarily, some gaps for space
        timing:
          active: ["1.1.1 - end"]

      - sound: bass_sweep
        pattern: once
        timing:
          description: final beat of section
          hits: ["16.4.1"]

  - section_name: outro
    duration_bars: 8
    elements:
      - sound: supersaw_lead
        notes: pretty cut off as outro section starts
        pattern: rapid 16th notes, pausing for a 16th note around the And of beat 2
        automation: hi cut gradually lowers
        timing:
          active: ["1.1.1 - end"]

      - sound: oooo_vocals
        pattern: half note / quarter note
        automation: hi cut gradually lowers
        timing:
          active: ["1.1.1 - end"]

      - sound: shimmer_pad
        pattern: pad, oscillates between 2 notes
        automation: volume gradually lowers
        timing:
          active: ["1.1.1 - end"]
