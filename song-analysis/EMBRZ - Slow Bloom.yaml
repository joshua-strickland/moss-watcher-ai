# yaml-language-server: $schema=./song-schema.json

track_metadata:
  artist: EMBRZ
  title: Slow Bloom
  key_signature: E Major
  bpm: 120
  time_signature: 4/4
  genre: Melodic House

sounds:
  ocean_foley:
    category: FX - Foley
    tonality: Ocean waves like noise, very quiet

  saw_pad:
    category: Synth - Pad
    tonality: simple saw like pad mid range, little bass content

  warmth_pad:
    category: Synth - Pad
    label: gentle piano rhythm / warmth pad
    tonality: a sort of heavy cut off, piano sounding like pad, adding just a bit of depth to the piano melody

  lead_keys:
    category: Keys - Piano
    label: lead melody keys

  rhythm_keys:
    category: Keys - Piano
    label: sampled sounding rhtyhm chord keys
    tonality: '"sampled" sounding key chords, sample start occurs just slightly after the transient'

  gentle_keys:
    category: Keys - Piano
    tonality: hi cut, reverb, background gentle keys, very subtle

  gentle_keys_synth:
    category: Synth - Pluck
    tonality: synth layer doubling the background gentle keys.
      hi cut, reverb, very subtle

  background_vocals:
    category: Vocals - Background
    tonality: soft female vocals fair amount of reverb
      Ahh vowel
      medium hi cut applied,

  vocal_ambience:
    category: Vocals - Background
    label: background female soft reverb vocal ambience
    tonality: Ehh and ahh vowel sounds, heavy reverb

  lead_vocals:
    category: Vocals - Lead
    tonality: soft female vocals fair amount of reverb

  vocal_chop:
    category: Vocals - Chop
    tonality: Ah vowel, reverb

  saw_swell:
    category: Synth - Swell
    tonality: Saw swell, slow ish attack and lots of reverb, very similar to the hypa saw swell preset.
      very much in the background / quiet
      long decay

  shaker:
    category: Drums - Shakers
    tonality: hi cut shaker
      Sounds potentially mixed with some white noise.
      unsure if the white noise is distinct or layered with shaker, but occurs with the same pattern

  snap_clap:
    category: Drums - Clap
    label: snap clap
    tonality: snap sounding clap, slight hi cut

  reverse_snap_clap:
    category: Drums - Clap
    label: reverse snap clap
    tonality: snap sounding clap, slight hi cut reversed

  kick:
    category: Drums - Kick

  hats:
    category: Drums - Hats
    tonality: rather high impact sounding, pretty high volume, adding a lot of energy to the track

  wood_block:
    category: Drums - Other Percussive
    tonality: wood block hit like sound

  lead_pluck:
    category: Synth - Pluck
    label: lead pluck
    tonality: hi cut saw pluck

  lazer_fx:
    category: FX - Synth
    tonality: lazer like sounding high frequency oscillator controlled synth noise
      LFO increases in frequency over a beat or two

  swell_bass:
    category: Bass
    label: core swell bass layer
    tonality: Growly bass, has that sort of rapid volume jitter effect from saturation or OTT similar
      kinda sounds like a bass guitar in isolation
      fundamentals fairly low around 55hz, 47hz, 74hz
      some mid layers extend upwards to 800-2k at times
      The bass seems to have a long decay that completely stops when the next note is played. Suspect some monophonic voicing in play
      Sidechained to each quarter note.
      Bass also seems to decay the hi cut so that the hi cut descends gradually as the notes ring out.
      The decay and the sidechain combine so that each "gate opening" of the side chain is a little bit quieter and a little bit more cut off

  swell_synth:
    category: Synth - Swell
    label: core swell synth layer
    tonality: chord saw synth swell layered with the bass
      This is still side chained to the kick so it swells just after
      fairly similar in tonality to the plucks, just a longer attack, and maybe a hair bit more lows cut
      The swell seems to have a long decay that completely stops when the next note is played. Suspect some monophonic voicing in play
      Sidechained to each quarter note.
      Swell also seems to decay the hi cut so that the hi cut descends gradually as the notes ring out.
      The decay and the sidechain combine so that each "gate opening" of the side chain is a little bit quieter and a little bit more cut off

  transition_pluck:
    category: Synth - Pluck
    label: quick transitionary pluck
    tonality: A pluck sounding almost identical to the core swell synth. gentle warm melodic house saw pluck

  background_synth_hit:
    category: Synth - Sustained
    label: background synth hit
    tonality: vocal like synth sounding hit creating a call and response like pattern

  noise_sweep:
    category: Transition - Sweep
    tonality: band passed white noise sweep

arrangement:

  - section_name: pre intro
    duration_bars: 2
    elements:
      - sound: ocean_foley
        timing:
          description: not audible all the time, comes and goes like waves
          active: ["1.1.1 - end"]

      - sound: saw_pad
        timing:
          active: ["1.1.1 - end"]

  - section_name: intro
    duration_bars: 8
    elements:
      - sound: lead_keys
        pattern: dotted eighth note kind of melody
        timing:
          active: ["1.1.1 - end"]

      - sound: background_vocals
        pattern: plays one note with a fairly long decay every 2 bars
        timing:
          active: ["4.1.1 - end"]

      - sound: warmth_pad
        pattern: plays one note with a fairly long decay every 2 bars
        automation: consistent volume for the most part until 7.1.1 where volume rises somewhat sharply leading into next section
        timing:
          active: ["4.1.1 - end"]

      - sound: saw_pad
        timing:
          active: ["1.1.1 - end"]

      - sound: rhythm_keys
        notes: the rhythm chord keys enter here
        timing:
          active: ["8.3.1 - end"]

      - sound: shaker
        pattern: A single shaker occurs serving as transitionary element leading to thee next section
        timing:
          hits: ["8.4.3"]

  - section_name: buildup
    duration_bars: 20
    global_transitions: 20.4.3 everything but piano cuts out
    elements:
      - sound: lead_keys
        timing:
          active: ["1.1.1 - end"]

      - sound: rhythm_keys
        notes: Hi cut filter applied, maybe a bit of distortion
          seems volume ducked slightly every quarter note
        timing:
          active: ["2.3.1 - end"]

      - sound: saw_swell
        timing:
          description: once every 4 bars
            also occurs at 12.1.1
          repeat:
            - start: "1.1.1"
              every_bars: 4
              length_bars: 1
          hits: ["12.1.1"]

      - sound: lead_vocals
        automation: hi cut gradually adjusts up and down as section progresses
        timing:
          active: ["1.1.1 - end"]

      - sound: shaker
        pattern: just a single shake on upbeats
        pattern_variation: on bar 13.1.1, pattern changes to 2 16th note shakes, starting on upbeats
        timing:
          active: ["1.1.1 - end"]

      - sound: snap_clap
        pattern: 2nd and 4th beat
        automation: 9.1.1, hi cut is removed? sounds louder and with more high frequency content
        timing:
          active: ["5.1.1 - end"]

      - sound: kick
        pattern: alternates between every 2 bars and every bar, see timing
        timing:
          hits: ["13.1.1", "15.1.1", "16.1.1", "17.1.1", "19.1.1", "20.1.1"]

      - sound: lead_pluck
        timing:
          active: ["13.1.1 - end"]

      - sound: hats
        pattern: x.1.3, x.2.1, x.2.3, x.3.3, x.4.1, x.4.3, repeating every bar
        timing:
          active: ["17.1.1 - end"]

      - sound: lazer_fx
        pattern: once
        timing:
          active: ["20.1.1 - 20.4.3"]

  - section_name: verse a
    duration_bars: 24
    global_transitions: 24.3.1 everything cuts except for bass, synth swell, and vocals
      24.4.1 clap hits, bass cuts, quick 2 note descending synth melody
    elements:
      - sound: kick
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]

      - sound: snap_clap
        pattern: 2nd and 4th beat
        timing:
          active: ["1.1.1 - end"]

      - sound: reverse_snap_clap
        pattern: every 4th clap hit
        timing:
          active: ["1.1.1 - end"]

      - sound: hats
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]
          mutes: ["8.4.3"]

      - sound: wood_block
        pattern: 1.2.4, 2.2.3, repeating every 2 bars
        timing:
          active: ["1.1.1 - end"]

      - sound: vocal_ambience
        pattern: every bar a new vocal sound strikes and then fades out over approx 2-3 beats
        timing:
          active: ["1.1.1 - end"]

      - sound: swell_bass
        pattern: 1.1.1, 3.1.1, 4.1.1, 4.3.1 repeating every 4 bars
        pattern_variation: Occasionally there is another swell on 4.4.1
          On 8.4.1, bass is heavily muted to lower and raise tension prior to next bar
        timing:
          active: ["1.1.1 - end"]

      - sound: swell_synth
        pattern: 1.1.1, 3.1.1, 4.1.1, 4.3.1 repeating every 4 bars
        pattern_variation: Occasionally there is another swell on 4.4.1
        timing:
          active: ["1.1.1 - end"]

      - sound: transition_pluck
        pattern: Just a single hit as a transitionary piece
        timing:
          hits: ["8.4.3"]

      - sound: background_synth_hit
        pattern: 2nd and 4th beats
        timing:
          active: ["1.1.1 - end"]

      - sound: vocal_chop
        timing:
          hits: ["7.1.1"]

      - sound: lead_vocals
        automation: this is so heavily hi cut that it is basically inaudible as section starts
          9.1.1 - begins to become "clearly" audible, though still very quiet  hi cut begins ascending for 8 bars
          17.1.1 - hi cut resets to a slightly lower frequency cut off point
        timing:
          active: ["1.1.1 - end"]

      - sound: gentle_keys
        timing:
          active: ["9.1.1 - end"]

      - sound: shaker
        pattern: 2 16th note shakes, starting on upbeats
        timing:
          active: ["17.1.1 - end"]

  - section_name: break
    duration_bars: 16
    global_transitions: everything but piano layer cuts on 16.4.1
    elements:
      - sound: shaker
        pattern: 2 16th note shakes, starting on upbeats
        timing:
          active: ["1.1.1 - end"]

      - sound: gentle_keys
        notes: this keys layer fades in and out with the synth pluck layer, which plays identical notes
        timing:
          active: ["1.1.1 - end"]

      - sound: gentle_keys_synth
        notes: This synth layer fades in and out with the keys layer, which plays identical notes
        pattern: this follows the background gently keys melody, but is a synth layer.
        timing:
          active: ["1.1.1 - end"]

      - sound: swell_bass
        pattern: 1.1.1, 3.1.1, 4.1.1, 4.3.1 repeating every 4 bars
        pattern_variation: Occasionally there is another swell on 4.4.1
        timing:
          active: ["1.1.1 - end"]
          mutes: ["16.4.1 - end"]

      - sound: saw_swell
        timing:
          description: once every 4 bars
            also occurs at 12.1.1
          repeat:
            - start: "1.1.1"
              every_bars: 4
              length_bars: 1
          hits: ["12.1.1"]

      - sound: kick
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]
          mutes: ["16.3.1", "16.4.1"]

      - sound: snap_clap
        pattern: 2nd and 4th beat
        timing:
          active: ["1.1.1 - end"]

      - sound: reverse_snap_clap
        pattern: every 4th clap hit
        timing:
          active: ["1.1.1 - end"]

      - sound: noise_sweep
        timing:
          active: ["16.3.1 - end"]

  - section_name: verse b
    duration_bars: 16
    elements:
      - sound: kick
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]

      - sound: snap_clap
        pattern: 2nd and 4th beat
        timing:
          active: ["1.1.1 - end"]

      - sound: hats
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]
          mutes: ["8.4.3"]

      - sound: wood_block
        pattern: 1.2.4, 2.2.3, repeating every 2 bars
        timing:
          active: ["1.1.1 - end"]

      - sound: swell_bass
        pattern: 1.1.1, 3.1.1, 4.1.1, 4.3.1 repeating every 4 bars
        pattern_variation: Occasionally there is another swell on 4.4.1
        timing:
          active: ["1.1.1 - end"]

      - sound: swell_synth
        pattern: 1.1.1, 3.1.1, 4.1.1, 4.3.1 repeating every 4 bars
        pattern_variation: Occasionally there is another swell on 4.4.1
        timing:
          active: ["1.1.1 - end"]

      - sound: transition_pluck
        pattern: Just a single hit as a transitionary piece
        timing:
          hits: ["8.4.3"]

      - sound: saw_swell
        timing:
          description: once every 4 bars
            also occurs at 12.1.1
          repeat:
            - start: "1.1.1"
              every_bars: 4
              length_bars: 1
          hits: ["12.1.1"]

      - sound: lead_vocals
        automation: filter is entirely open this time.
          hi cut filter begins descending approx 4.1.1, opens up again around 7.1.1
        timing:
          active: ["1.1.1 - end"]

      - sound: gentle_keys
        timing:
          active: ["9.1.1 - end"]

  - section_name: outro 1
    duration_bars: 16
    elements:
      - sound: shaker
        pattern: 2 16th note shakes, starting on upbeats
        timing:
          active: ["1.1.1 - end"]

      - sound: lead_vocals
        automation: filter is entirely open this time.
          hi cut filter begins descending approx 4.1.1, opens up again around 7.1.1
        timing:
          active: ["1.1.1 - end"]

      - sound: kick
        pattern: 4 on the floor
        timing:
          active: ["1.1.1 - end"]

      - sound: gentle_keys
        timing:
          active: ["1.1.1 - end"]

      - sound: swell_bass
        pattern: 1.1.1, 3.1.1, 4.1.1, 4.3.1 repeating every 4 bars
        pattern_variation: Occasionally there is another swell on 4.4.1
        timing:
          active: ["1.1.1 - end"]

  - section_name: outro 2
    duration_bars: 16
    elements:
      - sound: lead_keys
        notes: little filter if any applied
        pattern: same melody as intro
        timing:
          active: ["1.1.1 - end"]
